openapi: 3.0.3
info:
  title: Customer preferences
  version: 1.0.0
  description: |
    Sprint 10 module `com.yellow.trade.preferences`, inside the Trade REST API. Written before
    the controller and brought to the instructor on day one.

    One preference record per customer: the default account the application opens on, the
    landing screen sign-in goes to, and the channel alerts and notifications go out on. The
    contact detail is not stored here: it is the email on the customer's profile, referenced
    at the moment of sending (decision log 0003).

    With nothing stored, GET answers the documented default with `stored: false`: the
    customer's own account, the dashboard, and EMAIL (decision log 0004).

    The notifications module resolves a channel through the Java interface `ChannelResolver`,
    not through any route here, so no customer token can reach the resolution path
    (decision log 0002).

    Same error envelope as the contracts: `{ "errorCode", "message" }`.

servers:
  - url: http://localhost:8081
    description: Local stack

security:
  - bearerAuth: []

tags:
  - name: Preferences
    description: The customer's own settings.

paths:
  /api/v1/accounts/{id}/preferences:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Preferences]
      operationId: getPreferences
      summary: The customer's preferences, or the defaults when none are stored
      responses:
        '200':
          description: The preferences in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      tags: [Preferences]
      operationId: savePreferences
      summary: Store the customer's preferences, replacing what was there
      description: |
        `defaultAccountId` must be an account the caller owns: today, exactly the token's
        account, since a login has one account. Anything else is `ACC-403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdate'
      responses:
        '200':
          description: Stored; the preferences now in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountId:
      name: id
      in: path
      required: true
      description: The numeric account key; must be the token's own account (else `ACC-403`).
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    Error:
      description: The platform's error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LandingScreen:
      type: string
      enum: [dashboard, orders, holdings, market-watch]
      description: Where sign-in lands when no other page was asked for.

    AlertChannel:
      type: string
      enum: [EMAIL, IN_APP]
      description: |
        EMAIL also keeps the message in the in-app inbox; IN_APP keeps it there only. SMS and
        push are not provisioned on this platform.

    Preferences:
      type: object
      required: [accountId, defaultAccountId, landingScreen, alertChannel, contact, stored]
      properties:
        accountId:
          type: integer
          format: int64
        defaultAccountId:
          type: integer
          format: int64
        landingScreen:
          $ref: '#/components/schemas/LandingScreen'
        alertChannel:
          $ref: '#/components/schemas/AlertChannel'
        contact:
          type: string
          nullable: true
          description: |
            Where EMAIL goes, masked (`r•••@gmail.com`): the profile's address, shown so the
            customer knows. Read-only here; null for IN_APP.
        stored:
          type: boolean
          description: False while these are the defaults, nothing having been saved.
        updatedAt:
          type: string
          format: date-time
          nullable: true

    PreferencesUpdate:
      type: object
      additionalProperties: false
      required: [defaultAccountId, landingScreen, alertChannel]
      properties:
        defaultAccountId:
          type: integer
          format: int64
          minimum: 1
        landingScreen:
          $ref: '#/components/schemas/LandingScreen'
        alertChannel:
          $ref: '#/components/schemas/AlertChannel'

    ErrorResponse:
      type: object
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
          enum: [ACC-403, ACC-404, AUTH-401, VAL-422]
        message:
          type: string
