<section class="card sign-in">
  <h1>Sign in</h1>

  <app-error-message [error]="error()" [overrides]="wording" />

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="username">Username</label>
    <input
      id="username"
      formControlName="username"
      autocomplete="username"
      data-testid="sign-in-username"
      [attr.aria-invalid]="form.controls.username.touched && form.controls.username.invalid"
      aria-describedby="username-error"
    />
    @if (form.controls.username.touched && form.controls.username.invalid) {
      <p class="field-error" id="username-error">Enter your username.</p>
    }

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      data-testid="sign-in-password"
      [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      aria-describedby="password-error"
    />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error" id="password-error">Enter your password.</p>
    }

    <button type="submit" data-testid="sign-in-submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</section>
