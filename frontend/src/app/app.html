<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
  <a class="brand" [routerLink]="session.accessToken() ? '/stocks' : '/landing'">YELLOW // TRADE</a>
  @if (session.accessToken()) {
    <nav aria-label="Main">
      <a routerLink="/market-watch" routerLinkActive="active" class="watch-link" data-testid="nav-market-watch">Market watch</a>
      <a routerLink="/stocks" routerLinkActive="active">Stocks</a>
      <a routerLink="/mutual-funds" routerLinkActive="active">Mutual funds</a>
      <a routerLink="/trade" routerLinkActive="active" data-testid="nav-trade">Place an order</a>
      <a routerLink="/cash" routerLinkActive="active" data-testid="nav-cash">Cash</a>
    </nav>
    <span class="account" data-testid="header-account">
      @if (current.account(); as account) {
        <span class="holder">{{ account.holderName }}</span>
        <span class="ref">{{ account.accountId }}</span>
      }
    </span>
    <button type="button" class="secondary sign-out" data-testid="sign-out" (click)="signOut()">Sign out</button>
  } @else {
    <nav aria-label="Public">
      <a routerLink="/landing" routerLinkActive="active">Home</a>
      <a routerLink="/sign-in" routerLinkActive="active">Sign in</a>
      <a routerLink="/apply" routerLinkActive="active" class="button primary">Get started</a>
    </nav>
  }
</header>
<div class="workspace" [class.with-watch]="session.accessToken()">
  @if (session.accessToken()) {
    <aside class="watch-panel" aria-label="Market watch">
      <app-market-watch />
    </aside>
  }
  <main id="main" class="app-main">
    <router-outlet />
  </main>
</div>
