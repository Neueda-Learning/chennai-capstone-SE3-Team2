<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
  <a class="brand" routerLink="/">Trading Desk</a>
  @if (session.accessToken()) {
    <nav aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a routerLink="/trade" routerLinkActive="active" data-testid="nav-trade">Place an order</a>
    </nav>
    <span class="account">Account {{ session.accountId() }}</span>
    <button type="button" class="secondary" data-testid="sign-out" (click)="signOut()">Sign out</button>
  }
</header>
<main id="main" class="app-main">
  <router-outlet />
</main>
