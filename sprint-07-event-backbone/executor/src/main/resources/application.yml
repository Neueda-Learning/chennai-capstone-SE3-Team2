# =====================================================================
# Trade Executor configuration.
#
# Every value that differs between a laptop and a container comes from
# the environment, with a local default after the colon so that a fresh
# clone runs. FAUXNANCE_API_KEY is the exception and has no default on
# purpose: a default credential is a credential that ships, and the
# application refuses to start without one rather than accepting every
# order and failing to price any of them. Same rule the Trade REST API
# applies to JWT_SECRET.
# =====================================================================

spring:
  application:
    name: trade-executor

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Modest: this service does one order at a time per consumer, and a
      # large pool would just hold connections the Trade REST API wants.
      maximum-pool-size: ${DB_POOL_MAX:5}
      connection-timeout: 5000
      pool-name: trade-executor-pool

  kafka:
    # kafka:29092 from inside the network, localhost:9092 from the host.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

executor:
  # Fixed by contracts/kafka-topics.md. `orders` is a work queue with
  # exactly one logical consumer group: a second group would mean two
  # services executing the same order.
  consumer-group: trade-executor
  topics:
    orders: orders
    trade-events: trade-events
    market-data: market-data

fauxnance:
  base-url: ${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
  # No default, deliberately. Resolution fails at startup without it.
  api-key: ${FAUXNANCE_API_KEY}
  timeout: 10s
  # Three tries for one symbol. Beyond that we are holding up a partition
  # to wait for a price the customer would rather be told we cannot get.
  max-attempts: 3
  initial-backoff: 500ms
  # Capped so a large Retry-After cannot park a consumer thread: a parked
  # consumer stops every account on its partitions.
  max-backoff: 5s
  # Per key per day, resetting 00:00 UTC, which is 05:30 IST.
  daily-quota: 2000
  # Held back from the poller. An order a customer is waiting on outranks
  # a price update nobody asked for, and the first symptom of getting
  # this wrong is orders rejected for want of a price.
  fill-reserve: 200

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-executor-type: simple
    jdbc-type-for-null: 'NULL'

management:
  endpoints:
    web:
      exposure:
        # Health only: the orchestrator needs to know the service is up,
        # and nothing else belongs on an unauthenticated port.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    root: INFO
    com.yellow: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
