openapi: 3.0.3
info:
  title: Trade advice and signals
  version: 1.0.0
  description: |
    Sprint 10 stretch module `com.yellow.trade.advice`, inside the Trade REST API. Written
    before the controller.

    A stated view on one instrument: BUY, SELL or HOLD, with how strong, the numbers behind it
    and one sentence saying what produced it. One methodology: the 20-day against the 50-day
    simple moving average of daily closes (the trend), confirmed by the 14-day RSI. The daily
    candles come cached from the market-data module (they do not move inside a day); the latest
    price comes from `market-data` (consumer group `advice-service`). Recomputed on a timer,
    not on every quote.

    Information, not advice to trade: the response says so, and the screen shows it. Market
    data is public, so any signed-in customer may read any instrument's signal; there is no
    account in the path to compare the token against.

    With too little data for a view there is no signal at all: `direction` and `strength` are
    null and `reason` says what is missing. A HOLD is a view, not the absence of one.

    `GET /api/v1/accounts/{id}/advice` gives a signal for every stock the account holds (read
    from the portfolio module) and watches (read from the watchlists module), holdings first,
    at most 30. The caller's own account only (`ACC-403`).

    Same error envelope as the contracts: `{ "errorCode", "message" }`.

servers:
  - url: http://localhost:8085
    description: Local stack

security:
  - bearerAuth: []

tags:
  - name: Advice
    description: Signals computed from real candles.

paths:
  /api/v1/advice/{symbol}:
    parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          maxLength: 30
    get:
      tags: [Advice]
      operationId: getSignal
      summary: The signal for one stock
      description: |
        A fund has no daily candles here, so no signal: `VAL-422`. Too little history for a
        50-day average is no signal: `direction` null, and the reason says so. No candles to be
        had at all is `MKT-503`.
      responses:
        '200':
          description: The signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Signal'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /api/v1/accounts/{id}/advice:
    parameters:
      - name: id
        in: path
        required: true
        description: The numeric account key; must be the token's own account (else `ACC-403`).
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Advice]
      operationId: getAccountAdvice
      summary: A signal for every stock the account holds or watches
      description: |
        Holdings first, then watchlist entries, each symbol once, at most 30 (`truncated` says
        when there were more). A stock with no view to give is listed with no signal and the
        reason: a fund, too little history, prices not readable just now, or no longer traded.
        One stock's trouble never fails the list.
      responses:
        '200':
          description: The signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountAdvice'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: The platform's error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Signal:
      type: object
      required: [symbol, direction, strength, methodology, reason, figures, computedAt, disclaimer]
      properties:
        symbol:
          type: string
        direction:
          type: string
          enum: [BUY, SELL, HOLD]
          nullable: true
          description: The view. Null is no signal at all, for too little data; `reason` says why.
        strength:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: How far the averages are apart and how the RSI agrees, as 0 to 100. Null with no signal.
        methodology:
          type: string
          example: 20/50-day moving average crossover, confirmed by RSI(14)
        reason:
          type: string
          example: The 20-day average is 3.1% above the 50-day and RSI is 58, so the trend is up.
        figures:
          allOf:
            - $ref: '#/components/schemas/SignalFigures'
          nullable: true
          description: Null when nothing could be computed (a fund, or prices not readable).
        computedAt:
          type: string
          format: date-time
        disclaimer:
          type: string
          example: Information, not advice. Computed from delayed educational data.

    SignalFigures:
      type: object
      required: [days]
      properties:
        sma20:
          type: number
          nullable: true
        sma50:
          type: number
          nullable: true
        rsi14:
          type: number
          nullable: true
        lastPrice:
          type: number
          nullable: true
        priceAsOf:
          type: string
          format: date-time
          nullable: true
        days:
          type: integer
          description: How many daily closes it was computed from.

    AccountAdvice:
      type: object
      required: [accountId, items, truncated, disclaimer]
      properties:
        accountId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdviceItem'
        truncated:
          type: boolean
          description: More than 30 stocks are held or watched; the first 30 are here, holdings first.
        disclaimer:
          type: string
    AdviceItem:
      type: object
      required: [symbol, held, watched, signal]
      properties:
        symbol:
          type: string
        held:
          type: boolean
        watched:
          type: boolean
        signal:
          $ref: '#/components/schemas/Signal'
    ErrorResponse:
      type: object
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
          enum: [AUTH-401, ACC-403, VAL-422, INS-404, MKT-503]
        message:
          type: string
