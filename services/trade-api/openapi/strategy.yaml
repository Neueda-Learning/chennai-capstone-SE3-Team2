openapi: 3.0.3
info:
  title: Automated strategy execution
  version: 1.0.0
  description: |
    Sprint 10 stretch module `com.yellow.trade.strategy`, inside the Trade REST API. Written
    before the controller.

    A rule set once and traded by the platform. Four triggers: buy or sell when the price falls
    to or rises to a level (`FALLS_THROUGH`, `RISES_THROUGH`); when the 20-day moving average
    crosses the 50-day (`MA_CROSSOVER`: a buy on the cross above, a sell on the cross below);
    or when the price reaches its Bollinger band (`BOLLINGER`: the 20-day average two standard
    deviations either side; a buy at the lower band, a sell at the upper). The indicators read
    daily closes with the live price counted as today's close (decision log 0017). Quotes from
    `market-data` trigger it and fills from `trade-events` tell it what happened (consumer group
    `strategy-service` for both).

    A strategy places its order through `POST /api/v1/orders` over HTTP, never on the `orders`
    topic and never by calling the order service: the route's validation, authorisation and
    idempotency stand between a strategy bug and a position. Nobody is signed in when it fires,
    so it asks the auth service, on an internal route behind the service secret, for an access
    token minutes long for that one account (decision log 0012); the order route checks it as
    it checks any token.

    Bounded in code: each strategy has a maximum spend and a maximum position, and stops after
    three failed attempts. A disabled strategy is stopped at once: the flag is read in the same
    transaction that would fire it. At most 10 strategies an account (`LIM-409`). Every route is
    the caller's own account only.

    Same error envelope as the contracts: `{ "errorCode", "message" }`.

servers:
  - url: http://localhost:8085
    description: Local stack

security:
  - bearerAuth: []

tags:
  - name: Strategies
    description: Rules the platform trades for the customer.

paths:
  /api/v1/accounts/{id}/strategies:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Strategies]
      operationId: getStrategies
      summary: The account's strategies, newest first
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Strategy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Strategies]
      operationId: createStrategy
      summary: Create a strategy, disabled until enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyRequest'
      responses:
        '201':
          description: Created, disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /api/v1/accounts/{id}/strategies/{strategyId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/StrategyId'
    delete:
      tags: [Strategies]
      operationId: deleteStrategy
      summary: Delete a strategy; its runs stay readable until then
      responses:
        '204':
          description: Gone
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/accounts/{id}/strategies/{strategyId}/enabled:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/StrategyId'
    put:
      tags: [Strategies]
      operationId: setStrategyEnabled
      summary: Enable or disable a strategy; disabling stops it at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnabledRequest'
      responses:
        '200':
          description: Its new state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/accounts/{id}/strategies/{strategyId}/runs:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/StrategyId'
    get:
      tags: [Strategies]
      operationId: getStrategyRuns
      summary: Every time the strategy fired or refused to, newest first
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StrategyRun'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountId:
      name: id
      in: path
      required: true
      description: The numeric account key; must be the token's own account (else `ACC-403`).
      schema:
        type: integer
        format: int64
        minimum: 1
    StrategyId:
      name: strategyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    Error:
      description: The platform's error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Strategy:
      type: object
      required: [id, symbol, side, quantity, trigger, triggerPrice, maxSpend, maxPosition, enabled, status, failures, createdAt]
      properties:
        id:
          type: integer
          format: int64
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: integer
          minimum: 1
        trigger:
          type: string
          enum: [FALLS_THROUGH, RISES_THROUGH, MA_CROSSOVER, BOLLINGER]
        triggerPrice:
          type: number
          nullable: true
          description: The level of a falls-to or rises-to trigger; null for an indicator trigger.
        maxSpend:
          type: number
          description: The most one firing may cost, at its limit price.
        maxPosition:
          type: integer
          description: The most of the instrument the account may hold after a buy.
        enabled:
          type: boolean
        status:
          type: string
          enum: [ARMED, FIRED, STOPPED]
          description: ARMED waits for the trigger; FIRED has placed its order; STOPPED gave up after failures.
        failures:
          type: integer
        createdAt:
          type: string
          format: date-time
        lastFiredAt:
          type: string
          format: date-time
          nullable: true
        indicator:
          allOf:
            - $ref: '#/components/schemas/StrategyIndicator'
          nullable: true
          description: |
            For an indicator trigger, what it waits on at the last quote seen; null for a level
            trigger, or before any quote since the service started.

    StrategyRequest:
      type: object
      additionalProperties: false
      required: [symbol, side, quantity, trigger, maxSpend, maxPosition]
      properties:
        symbol:
          type: string
          maxLength: 30
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: integer
          minimum: 1
        trigger:
          type: string
          enum: [FALLS_THROUGH, RISES_THROUGH, MA_CROSSOVER, BOLLINGER]
        triggerPrice:
          type: number
          nullable: true
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
          description: Required for FALLS_THROUGH and RISES_THROUGH; absent for MA_CROSSOVER and BOLLINGER (else `VAL-422`).
        maxSpend:
          type: number
          exclusiveMinimum: true
          minimum: 0
        maxPosition:
          type: integer
          minimum: 1

    EnabledRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean

    StrategyIndicator:
      type: object
      required: [price, asOf, days]
      properties:
        price:
          type: number
          description: The quote's price, counted as today's close.
        asOf:
          type: string
          format: date-time
        days:
          type: integer
          description: How many daily closes the figures were computed from, today's price counted as one.
        shortAverage:
          type: number
          nullable: true
          description: The 20-day simple moving average.
        longAverage:
          type: number
          nullable: true
          description: The 50-day simple moving average.
        lowerBand:
          type: number
          nullable: true
          description: The lower Bollinger band, the 20-day average less two standard deviations.
        upperBand:
          type: number
          nullable: true
          description: The upper Bollinger band.

    StrategyRun:
      type: object
      required: [id, at, outcome]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        quotePrice:
          type: number
          nullable: true
        outcome:
          type: string
          enum: [PLACED, FILLED, REJECTED, REFUSED_LIMIT, FAILED, STOPPED]
        reason:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
          description: Uses `LIM-409` (a cap reached) and `STR-404` (no such strategy on this account).
          enum: [ACC-403, AUTH-401, VAL-422, INS-404, LIM-409, STR-404]
        message:
          type: string
