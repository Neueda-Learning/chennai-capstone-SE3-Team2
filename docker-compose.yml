# Local stack:  docker compose --profile platform up -d --build
# Values that differ per machine come from .env, which is not committed.

name: fauxnance

services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: fauxnance-kafka
    profiles: [platform]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Kafka defaults assume >= 3 brokers for its internal topics; on one
      # broker that silently blocks __consumer_offsets and every consumer
      # group hangs on FIND_COORDINATOR.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # No join delay: pointless on a single-node stack.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: "fauxnance-sprint7-kraft"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fauxnance-postgres
    profiles: [platform]
    environment:
      POSTGRES_DB: ${DB_NAME:-trading}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${DB_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied in filename order, and ONLY when the volume is empty.
      - ./data/db/base/000_base_schema.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./data/db/migrations/001_schema_migrations.sql:/docker-entrypoint-initdb.d/02-migration-001.sql:ro
      - ./data/db/migrations/002_api_alignment.sql:/docker-entrypoint-initdb.d/03-migration-002.sql:ro
      - ./data/db/migrations/003_account_last_updated.sql:/docker-entrypoint-initdb.d/04-migration-003.sql:ro
      - ./data/db/migrations/004_execution_columns.sql:/docker-entrypoint-initdb.d/05-migration-004.sql:ro
      - ./data/db/migrations/005_drop_client_auth.sql:/docker-entrypoint-initdb.d/06-migration-005.sql:ro
      - ./data/db/indexes/001_performance_indexes.sql:/docker-entrypoint-initdb.d/07-indexes.sql:ro
      - ./data/db/seed/001_reference_data.sql:/docker-entrypoint-initdb.d/08-seed-reference.sql:ro
      - ./data/db/seed/002_clients.sql:/docker-entrypoint-initdb.d/09-seed-clients.sql:ro
      - ./data/db/seed/003_instruments.sql:/docker-entrypoint-initdb.d/10-seed-instruments.sql:ro
      - ./data/db/seed/004_transactions.sql:/docker-entrypoint-initdb.d/11-seed-transactions.sql:ro
      # Symbols Fauxnance can price. The fictional ones above stay, and
      # become the live no-price demonstration.
      - ./data/db/seed/005_fauxnance_instruments.sql:/docker-entrypoint-initdb.d/12-seed-fauxnance.sql:ro
    networks: [trading-net]
    healthcheck:
      # -U and -d matter: the default reports healthy too early.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-trading}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  trade-api:
    build:
      # Repository root: the service depends on the sibling domain module.
      context: .
      dockerfile: services/trade-api/Dockerfile
    container_name: fauxnance-trade-api
    profiles: [platform]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trading}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # No default: the service refuses to start rather than accept
      # tokens anybody could mint.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      # kafka:29092, not localhost: inside a container localhost is that
      # container, and nothing would answer.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PUBLISHED_PORT:-8080}:8080"
    networks: [trading-net]
    depends_on:
      postgres:
        # On health, not mere existence: starting early is a crash loop.
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Consumes accepted orders, prices them, settles them. Hosts the
  # market-data poller, so one process holds the API key and its budget.
  executor:
    build:
      # Repository root: depends on the sibling domain module.
      context: .
      dockerfile: services/trade-executor/Dockerfile
    container_name: fauxnance-executor
    profiles: [platform]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trading}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # No default: no key, no start.
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY:?FAUXNANCE_API_KEY must be set in .env}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:-https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
      # 60s = 1440 requests a day of 2000. The floor is enforced in code.
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      SERVER_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${EXECUTOR_PUBLISHED_PORT:-8081}:8081"
    networks: [trading-net]
    depends_on:
      postgres:
        # On the health condition. Starting before the database accepts
        # connections is a crash loop, not a failure.
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Sprint 8. The only component that ever sees a password. Its own database,
  # because it is a separate service and read access to the trading data should
  # not come with it.
  auth-postgres:
    image: postgres:16-alpine
    container_name: fauxnance-auth-postgres
    profiles: [platform]
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set in .env}
    ports:
      - "${AUTH_DB_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
      # Applied only when the volume is empty, same as the trading database.
      - ./services/auth/migrations/001_credentials.sql:/docker-entrypoint-initdb.d/01-credentials.sql:ro
      - ./services/auth/migrations/002_refresh_tokens.sql:/docker-entrypoint-initdb.d/02-refresh-tokens.sql:ro
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth} -d ${AUTH_DB_NAME:-auth}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: fauxnance-auth
    profiles: [platform]
    environment:
      # The same secret the Trade REST API verifies with. That is what makes
      # adopting this service a configuration change rather than a code change.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      AUTH_DATABASE_URL: postgresql://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD}@auth-postgres:5432/${AUTH_DB_NAME:-auth}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # 3000 is reserved for this service in infra/README.md.
      - "${AUTH_PUBLISHED_PORT:-3000}:3000"
    networks: [trading-net]
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  trading-net:
    driver: bridge

volumes:
  postgres-data:
  auth-postgres-data:
  kafka-data:
