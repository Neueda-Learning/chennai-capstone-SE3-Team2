# =====================================================================
# Local orchestration for the trading platform.
#
#   docker compose --profile platform up -d --build
#
# Nothing in Sprint 6 needs Kafka.
#
# Every value that differs between a laptop and a deployment comes from
# .env, which is not committed. See .env.example.
# =====================================================================

name: fauxnance

services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: fauxnance-kafka
    profiles: [platform]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single-broker cluster settings. Kafka's defaults assume >= 3
      # brokers for its two internal topics; on one broker the defaults
      # silently prevent __consumer_offsets and __transaction_state from
      # being created, and every consumer group's FIND_COORDINATOR
      # then hangs. Set them to 1 explicitly.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # No initial delay before the first consumer's join is accepted.
      # The default 3s is fine for a large cluster where several
      # consumers arrive together; on a single-node dev stack it just
      # slows every startup.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: "fauxnance-sprint7-kraft"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fauxnance-postgres
    profiles: [platform]
    environment:
      POSTGRES_DB: ${DB_NAME:-trading}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      # Published so psql from the host can reach it during a review.
      - "${DB_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied in filename order on first start of an empty volume,
      # which is the same order sprint-3/db/apply.sh uses. Read-only:
      # nothing in the container has any business editing the schema.
      - ./sprint-3/db/base/000_base_schema.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./sprint-3/db/migrations/001_schema_migrations.sql:/docker-entrypoint-initdb.d/02-migration-001.sql:ro
      - ./sprint-3/db/migrations/002_api_alignment.sql:/docker-entrypoint-initdb.d/03-migration-002.sql:ro
      - ./sprint-3/db/migrations/003_account_last_updated.sql:/docker-entrypoint-initdb.d/04-migration-003.sql:ro
      - ./sprint-3/db/migrations/004_execution_columns.sql:/docker-entrypoint-initdb.d/05-migration-004.sql:ro
      - ./sprint-3/db/indexes/001_performance_indexes.sql:/docker-entrypoint-initdb.d/06-indexes.sql:ro
      - ./sprint-3/db/seed/001_reference_data.sql:/docker-entrypoint-initdb.d/07-seed-reference.sql:ro
      - ./sprint-3/db/seed/002_clients.sql:/docker-entrypoint-initdb.d/08-seed-clients.sql:ro
      - ./sprint-3/db/seed/003_instruments.sql:/docker-entrypoint-initdb.d/09-seed-instruments.sql:ro
      - ./sprint-3/db/seed/004_transactions.sql:/docker-entrypoint-initdb.d/10-seed-transactions.sql:ro
      # Sprint 7: symbols Fauxnance can actually price. The fictional ones
      # above stay, and become the live no-price demonstration.
      - ./sprint-3/db/seed/005_fauxnance_instruments.sql:/docker-entrypoint-initdb.d/11-seed-fauxnance.sql:ro
    networks: [trading-net]
    healthcheck:
      # -U and -d matter: the default probes the "postgres" database as
      # the "root" user and reports healthy while ours is still building.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-trading}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  trade-api:
    build:
      # The context is the repository root, because the service depends
      # on the sibling domain module. The reactor builds both from here
      # in one Maven invocation; see trade-api/Dockerfile.
      context: .
      dockerfile: trade-api/Dockerfile
    container_name: fauxnance-trade-api
    profiles: [platform]
    environment:
      # postgres by service name, not localhost: inside a container,
      # localhost is that container.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trading}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # No default. The service refuses to start without it rather than
      # accepting tokens anybody could mint. Sprint 8's auth service
      # reads the same value, which is what makes that swap configuration
      # rather than code.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Story 609: trade-api publishes ORDER_PLACED to `orders` after
      # commit. Without this, the producer falls back to localhost:9092
      # (application.yml default), which inside the container is the
      # trade-api itself and nothing answers -- orders commit to
      # Postgres and are never published, so they stay at NEW for ever.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PUBLISHED_PORT:-8080}:8080"
    networks: [trading-net]
    depends_on:
      postgres:
        # On the health condition, not on the container merely existing.
        # Starting before the database accepts connections is a crash
        # loop, not a failure, and it is slower to diagnose than it looks.
        condition: service_healthy
      kafka:
        # Same reason as postgres. A producer that comes up before the
        # broker spends its first minute retrying connections and
        # logging noise. The publish path also has a bounded retry
        # budget, so once that is spent the order commits with no
        # event -- which is the current failure mode.
        condition: service_healthy
    restart: unless-stopped

  # Sprint 7. Consumes accepted orders, prices them against Fauxnance,
  # settles them, and publishes the outcome. The market-data poller runs
  # inside this same container as a scheduled component -- one process
  # holds the API key, so one process divides the 2000-a-day budget.
  executor:
    build:
      # The repository root, because the executor depends on the sibling
      # domain module for the rules it re-checks. See its Dockerfile.
      context: .
      dockerfile: sprint-07-event-backbone/executor/Dockerfile
    container_name: fauxnance-executor
    profiles: [platform]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trading}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # kafka:29092, not localhost:9092: inside a container, localhost is
      # that container. The host port is for the console tools.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # No default. The executor prices every order against Fauxnance and
      # refuses to start without a key rather than accepting orders and
      # failing to price any of them.
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY:?FAUXNANCE_API_KEY must be set in .env}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:-https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
      # 60s with 25 symbols is 1440 requests a day, leaving 560 of 2000
      # for the fill path. The floor is enforced in code, not here.
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      SERVER_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # Published so the health endpoint can be read during a review.
      - "${EXECUTOR_PUBLISHED_PORT:-8081}:8081"
    networks: [trading-net]
    depends_on:
      postgres:
        # On the health condition. Starting before the database accepts
        # connections is a crash loop, not a failure.
        condition: service_healthy
      kafka:
        # Likewise: a consumer that starts before the broker spends its
        # first minute retrying a connection and logging noise.
        condition: service_healthy
    restart: unless-stopped

networks:
  trading-net:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
