# An EKS cluster for Yellow Trade: eksctl create cluster -f k8s/cluster.example.yaml
# Change the name and region to yours (README step 1). Two t3.medium nodes hold Kafka,
# the three services and the frontend (and the optional Postgres).
# eksctl makes a NEW VPC for it; README step 4 connects that VPC to your RDS.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: etp-cluster-1
  region: ap-south-1
managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    minSize: 2
    desiredCapacity: 2
    maxSize: 3
    volumeSize: 30
    privateNetworking: true
iam:
  withOIDC: true
addons:
  - name: vpc-cni
  - name: kube-proxy
  - name: coredns
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
